repos:
  # ---------------------------------------------------------------------------
  # Hooks generales
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  # ---------------------------------------------------------------------------
  # Python: ruff (linter + formatter)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ---------------------------------------------------------------------------
  # Python: mypy (type checking estricto)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^backend/intellectclone/
        args: [--config-file=backend/pyproject.toml]
        additional_dependencies:
          - pydantic>=2.11.0
          - pydantic-settings>=2.8.0

  # ---------------------------------------------------------------------------
  # Frontend: prettier
  # Usamos local para que el binario de frontend/node_modules resuelva
  # prettier-plugin-tailwindcss correctamente (prettier 3.x requiere que el
  # plugin esté en node_modules accesible desde donde corre el proceso).
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && exec node_modules/.bin/prettier --write "${@#frontend/}"' --
        language: system
        files: ^frontend/src/
        types_or: [ts, tsx, json, css]
