# =============================================================================
# IntellectClone — Directivas Nginx para Plesk
#
# INSTRUCCIONES:
#   1. En Plesk: Domains → elegant-keller.212-227-239-140.plesk.page
#      → Apache & Nginx Settings → "Additional nginx directives"
#   2. Pegar el contenido de este archivo en el campo correspondiente.
#   3. En ese mismo panel: marcar "Serve static files directly by nginx" = ON
#      y desmarcar el proxy a Apache para este dominio (o configurar como
#      "Nginx served site" sin Apache si Plesk lo permite).
#
# NOTA: estas directivas van DENTRO del bloque server{} que Plesk administra.
# No incluir server{}, listen ni ssl_certificate — Plesk los genera.
# =============================================================================

# --- Frontend Next.js (raíz del sitio) ---
location / {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
}

# --- API interna (/api/v1/*) → backend FastAPI ---
location /api {
    proxy_pass         http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 20M;
}

# --- API de exportación Mirrorfish (/export/v1/*) → backend FastAPI ---
location /export {
    proxy_pass         http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# --- Documentación OpenAPI (FastAPI /docs y /openapi.json) ---
location /docs {
    proxy_pass         http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location /openapi.json {
    proxy_pass         http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
