[project]
name = "intellectclone"
version = "0.1.0"
description = "Plataforma de gemelos digitales de la comunidad académica UAT"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # ORM y base de datos
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.15.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.4.0",

    # Validación
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",

    # Autenticación
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Tareas asíncronas
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # HTTP y cosecha
    "httpx>=0.28.0",
    "sickle>=0.7.0",
    "pyalex>=0.15.0",
    "beautifulsoup4>=4.13.0",
    "playwright>=1.50.0",

    # PDFs
    "pypdf>=5.4.0",
    "pdfplumber>=0.11.0",

    # NLP
    "spacy>=3.8.0",
    "nltk>=3.9.0",

    # LLMs
    "anthropic>=0.49.0",
    "google-genai>=1.10.0",
    "openai>=1.75.0",

    # Utilidades
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "structlog>=25.3.0",
    "trafilatura>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.1.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.1.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "pre-commit>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI usa Query()/Depends() en defaults de función — patrón intencional del framework
"intellectclone/api/**/*.py" = ["B008"]
# Excepciones de dominio en español — sufijo Error no aplica a nombres de dominio UAT
"intellectclone/api/excepciones.py" = ["N818"]
"intellectclone/llm/tipos.py" = ["N818"]
# Alembic requiere sys.path manipulation antes de imports — patrón estándar del framework
"alembic/env.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["intellectclone"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "celery.*", "redis.*", "sickle.*", "pyalex.*", "bs4.*", "trafilatura.*", "pypdf.*", "pdfplumber.*", "spacy.*", "nltk.*", "jose.*", "passlib.*", "slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["intellectclone"]
