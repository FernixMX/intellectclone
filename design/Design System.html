<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IntellectClone — Design System</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.469.0/font/lucide.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* ── DS Shell ── */
.ds-shell { display: flex; min-height: 100vh; background: var(--bg-base); }
.ds-sidebar {
  width: 220px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
  overflow-y: auto; border-right: var(--border-width) solid var(--border-subtle);
  background: var(--bg-surface); padding: var(--sp-6) 0;
}
.ds-sidebar-logo {
  padding: 0 var(--sp-4) var(--sp-6);
  border-bottom: var(--border-width) solid var(--border-subtle);
  margin-bottom: var(--sp-4);
}
.ds-sidebar-logo-mark {
  width: 28px; height: 28px; background: var(--accent-primary);
  border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
  margin-bottom: var(--sp-2);
}
.ds-sidebar-logo-mark span { color: #fff; font: 600 13px/1 var(--font-sans); }
.ds-sidebar-name { font: 600 13px/1 var(--font-sans); color: var(--text-primary); }
.ds-sidebar-sub { font: var(--text-caption); color: var(--text-quaternary); margin-top: 2px; }
.ds-nav-section { padding: var(--sp-2) var(--sp-4) var(--sp-1); }
.ds-nav-section-label {
  font: 500 11px/1 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-quaternary);
}
.ds-nav-item {
  display: flex; align-items: center; gap: var(--sp-2); padding: 6px var(--sp-3);
  margin: 1px var(--sp-2); border-radius: var(--radius-md); cursor: pointer;
  font: var(--text-body-s); color: var(--text-tertiary);
  text-decoration: none; transition: background 120ms, color 120ms;
  border: none; background: none; width: calc(100% - 16px); text-align: left;
}
.ds-nav-item:hover { background: var(--bg-subtle); color: var(--text-primary); }
.ds-nav-item.active {
  background: var(--bg-subtle); color: var(--text-primary);
  border-left: 2px solid var(--accent-primary); padding-left: calc(var(--sp-3) - 2px);
}
.ds-content { flex: 1; overflow-y: auto; }
.ds-section { padding: var(--sp-16) var(--sp-12); max-width: 960px; }
.ds-section + .ds-section { border-top: var(--border-width) solid var(--border-subtle); }
.ds-section-eyebrow {
  font: 500 11px/1 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-quaternary); margin-bottom: var(--sp-2);
}
.ds-section-title { font: var(--text-h2); letter-spacing: -0.015em; color: var(--text-primary); margin-bottom: var(--sp-2); }
.ds-section-desc { font: var(--text-body); color: var(--text-tertiary); margin-bottom: var(--sp-8); max-width: 560px; }
.ds-row { display: flex; align-items: flex-start; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-8); }
.ds-row-label { font: var(--text-caption); color: var(--text-quaternary); margin-bottom: var(--sp-3); }
.ds-group { display: flex; flex-direction: column; gap: var(--sp-3); }
.ds-divider { height: var(--border-width); background: var(--border-subtle); margin: var(--sp-8) 0; }

/* Mode toggle */
.mode-toggle {
  position: fixed; top: var(--sp-4); right: var(--sp-4);
  display: flex; align-items: center; gap: var(--sp-1);
  background: var(--bg-surface); border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-md); padding: 3px; z-index: 100;
  box-shadow: var(--shadow-sm);
}
.mode-toggle-btn {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: 4px; cursor: pointer; border: none; background: none;
  color: var(--text-quaternary); transition: background 120ms, color 120ms;
}
.mode-toggle-btn.active { background: var(--bg-subtle); color: var(--text-primary); box-shadow: var(--shadow-sm); }

/* ── TOKENS ── */
.color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-3); }
.color-swatch {
  border-radius: var(--radius-md); overflow: hidden;
  border: var(--border-width) solid var(--border-subtle);
}
.color-swatch-block { height: 48px; }
.color-swatch-info { padding: var(--sp-2) var(--sp-3); background: var(--bg-surface); }
.color-swatch-name { font: var(--text-caption); color: var(--text-primary); }
.color-swatch-hex { font: var(--text-mono); color: var(--text-quaternary); }

/* ── TYPE SCALE ── */
.type-specimen-row {
  display: grid; grid-template-columns: 100px 1fr; gap: var(--sp-4);
  align-items: baseline; padding: var(--sp-3) 0;
  border-bottom: var(--border-width) solid var(--border-subtle);
}
.type-specimen-meta { font: var(--text-mono); color: var(--text-quaternary); font-size: 11px; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  border: none; cursor: pointer; font: var(--text-caption);
  font-family: var(--font-sans); font-weight: 500; font-size: 13px;
  border-radius: var(--radius-md); transition: background 120ms, color 120ms, border-color 120ms, transform 80ms, box-shadow 120ms;
  white-space: nowrap; text-decoration: none; outline: none; position: relative;
}
.btn:focus-visible { box-shadow: var(--shadow-focus); }
.btn:active { transform: scale(0.98); }

/* Sizes */
.btn-sm  { height: 32px; padding: 0 var(--sp-3); font-size: 12px; }
.btn-md  { height: 38px; padding: 0 var(--sp-4); }
.btn-lg  { height: 44px; padding: 0 var(--sp-5); font-size: 14px; }

/* Variants */
.btn-primary { background: var(--accent-primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

.btn-secondary {
  background: transparent; color: var(--text-primary);
  border: var(--border-width) solid var(--border-default);
}
.btn-secondary:hover:not(:disabled) { background: var(--bg-subtle); }

.btn-ghost { background: transparent; color: var(--text-secondary); border: none; }
.btn-ghost:hover:not(:disabled) { background: var(--bg-subtle); color: var(--text-primary); }

.btn-destructive { background: var(--danger); color: #fff; }
.btn-destructive:hover:not(:disabled) { background: #8a2424; }

.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
.btn-loading { pointer-events: none; }

.btn-spinner {
  width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
.btn-secondary .btn-spinner, .btn-ghost .btn-spinner {
  border-color: rgba(0,0,0,0.15); border-top-color: var(--text-primary);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── INPUTS ── */
.input-group { display: flex; flex-direction: column; gap: var(--sp-1); }
.input-label {
  font: 500 11px/1 var(--font-sans); letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-tertiary);
}
.input-wrap { position: relative; display: flex; align-items: center; }
.input {
  width: 100%; height: 38px; padding: 0 var(--sp-3);
  font: var(--text-body); font-family: var(--font-sans);
  color: var(--text-primary); background: var(--bg-surface);
  border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-md); outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.input::placeholder { color: var(--text-quaternary); }
.input:hover:not(:disabled) { border-color: var(--border-strong); }
.input:focus { border-color: var(--accent-primary); box-shadow: var(--shadow-focus); }
.input:disabled { opacity: 0.5; cursor: not-allowed; background: var(--bg-subtle); }
.input-error { border-color: var(--danger) !important; }
.input-error:focus { box-shadow: 0 0 0 3px rgba(163,45,45,0.15) !important; }
.input-helper { font: var(--text-caption); color: var(--text-tertiary); margin-top: var(--sp-1); }
.input-helper.error { color: var(--danger); }

.input-with-icon { padding-left: 36px; }
.input-icon-left {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-quaternary); pointer-events: none;
}
.input-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm); cursor: pointer; color: var(--text-quaternary);
  border: none; background: none;
  transition: color 120ms, background 120ms;
}
.input-clear:hover { color: var(--text-primary); background: var(--bg-subtle); }

.textarea {
  width: 100%; min-height: 80px; padding: var(--sp-2) var(--sp-3);
  font: var(--text-body); font-family: var(--font-sans); resize: vertical;
  color: var(--text-primary); background: var(--bg-surface);
  border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-md); outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.textarea:focus { border-color: var(--accent-primary); box-shadow: var(--shadow-focus); }

.select {
  appearance: none; padding-right: 32px; cursor: pointer;
  background-image: none;
}
.select-wrap { position: relative; }
.select-chevron {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-quaternary); pointer-events: none;
}

/* ── TAGS ── */
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px var(--sp-2); border-radius: var(--radius-sm);
  font: var(--text-caption); border: var(--border-width) solid;
  white-space: nowrap; line-height: 1;
}
.tag-neutral { color: var(--text-secondary); border-color: var(--border-default); background: transparent; }
.tag-info { color: var(--accent-text); border-color: var(--accent-primary); background: var(--accent-subtle); }
.tag-success { color: var(--success); border-color: var(--success); background: var(--success-subtle); }
.tag-warning { color: var(--warning); border-color: var(--warning); background: var(--warning-subtle); }
.tag-danger { color: var(--danger); border-color: var(--danger); background: var(--danger-subtle); }

.pill { border-radius: var(--radius-full) !important; }

.tag-dot {
  width: 6px; height: 6px; border-radius: var(--radius-full); flex-shrink: 0;
}

/* ── AVATARS ── */
.avatar {
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full); background: var(--bg-subtle);
  color: var(--text-secondary); font-family: var(--font-sans);
  font-weight: 500; flex-shrink: 0; overflow: hidden; position: relative;
  border: var(--border-width) solid var(--border-subtle);
}
.avatar-xs { width: 24px; height: 24px; font-size: 9px; }
.avatar-sm { width: 32px; height: 32px; font-size: 11px; }
.avatar-md { width: 40px; height: 40px; font-size: 14px; }
.avatar-lg { width: 56px; height: 56px; font-size: 18px; }
.avatar-xl { width: 80px; height: 80px; font-size: 26px; }
.avatar-self { background: var(--accent-subtle); color: var(--accent-text); }

/* ── CARDS ── */
.card {
  background: var(--bg-surface); border: var(--border-width) solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.card-subtle { background: var(--bg-subtle); border: none; border-radius: var(--radius-lg); }
.card-highlighted {
  background: var(--bg-surface); border: var(--border-width) solid var(--accent-primary);
  border-radius: var(--radius-lg);
}
.card-stat { display: flex; flex-direction: column; gap: var(--sp-1); }
.card-stat-eyebrow {
  font: 500 11px/1 var(--font-sans); letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-quaternary);
}
.card-stat-value { font: var(--text-mono-l); color: var(--text-primary); font-size: 28px; font-weight: 600; }
.card-stat-delta {
  display: inline-flex; align-items: center; gap: 3px;
  font: var(--text-caption); color: var(--success);
}
.card-stat-delta.negative { color: var(--danger); }

/* ── NAVIGATION ── */
.topbar {
  height: 56px; background: var(--bg-base);
  border-bottom: var(--border-width) solid var(--border-subtle);
  display: flex; align-items: center; padding: 0 var(--sp-6);
  gap: var(--sp-6);
}
.topbar-logo { display: flex; align-items: center; gap: var(--sp-2); text-decoration: none; }
.topbar-logo-mark {
  width: 24px; height: 24px; background: var(--accent-primary);
  border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
}
.topbar-logo-mark span { color: #fff; font: 600 10px/1 var(--font-sans); }
.topbar-logo-name { font: 600 14px/1 var(--font-sans); color: var(--text-primary); letter-spacing: -0.01em; }
.topbar-nav { display: flex; align-items: center; gap: var(--sp-1); flex: 1; }
.topbar-nav-item {
  height: 32px; padding: 0 var(--sp-3); display: flex; align-items: center;
  font: var(--text-body-s); color: var(--text-tertiary); border-radius: var(--radius-md);
  cursor: pointer; transition: background 120ms, color 120ms; text-decoration: none;
  border: none; background: none;
}
.topbar-nav-item:hover { background: var(--bg-subtle); color: var(--text-primary); }
.topbar-nav-item.active { color: var(--text-primary); }
.topbar-actions { display: flex; align-items: center; gap: var(--sp-2); margin-left: auto; }

.sidenav {
  width: 240px; background: var(--bg-subtle);
  border-right: var(--border-width) solid var(--border-subtle);
  padding: var(--sp-4) 0; display: flex; flex-direction: column; gap: var(--sp-1);
}
.sidenav-item {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3); margin: 1px var(--sp-2);
  border-radius: var(--radius-md); cursor: pointer;
  font: var(--text-body-s); color: var(--text-tertiary);
  transition: background 120ms, color 120ms; border: none; background: none;
  width: calc(100% - 16px); text-align: left;
}
.sidenav-item:hover { background: var(--bg-surface); color: var(--text-primary); }
.sidenav-item.active {
  background: var(--bg-surface); color: var(--text-primary);
  border-left: 2px solid var(--accent-primary);
  padding-left: calc(var(--sp-3) - 2px); border-radius: 0 var(--radius-md) var(--radius-md) 0;
}
.sidenav-label {
  font: 500 11px/1 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-quaternary); padding: var(--sp-3) var(--sp-5) var(--sp-1);
}

.breadcrumbs { display: flex; align-items: center; gap: 4px; }
.breadcrumb-item { font: var(--text-body-s); color: var(--text-tertiary); text-decoration: none; }
.breadcrumb-item:last-child { color: var(--text-primary); }
.breadcrumb-sep { color: var(--text-quaternary); display: flex; align-items: center; }

.tabs { display: flex; align-items: center; border-bottom: var(--border-width) solid var(--border-subtle); gap: 0; }
.tab-item {
  padding: var(--sp-2) var(--sp-4); font: var(--text-body-s);
  color: var(--text-tertiary); cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color 120ms, border-color 120ms;
}
.tab-item:hover { color: var(--text-primary); }
.tab-item.active { color: var(--text-primary); border-bottom-color: var(--accent-primary); font-weight: 500; }

/* ── TABLES ── */
.table { width: 100%; border-collapse: collapse; }
.table-head { background: var(--bg-subtle); }
.table-th {
  padding: 10px var(--sp-3); text-align: left;
  font: var(--text-caption); color: var(--text-tertiary);
  border-bottom: var(--border-width) solid var(--border-subtle);
  white-space: nowrap;
}
.table-th.right { text-align: right; }
.table-tr { border-bottom: var(--border-width) solid var(--border-subtle); }
.table-tr:hover { background: var(--bg-subtle); }
.table-tr:hover .row-actions { opacity: 1; }
.table-td { padding: 0 var(--sp-3); height: 40px; font: var(--text-body-s); color: var(--text-secondary); }
.table-td.mono { font: var(--text-mono); text-align: right; color: var(--text-primary); }
.row-actions { opacity: 0; display: flex; align-items: center; gap: var(--sp-1); transition: opacity 120ms; justify-content: flex-end; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(10,10,10,0.6);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--bg-surface); border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-xl); padding: var(--sp-8); width: 100%; max-width: 520px;
  box-shadow: var(--shadow-lg); position: relative;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-4); }
.modal-title { font: var(--text-h3); letter-spacing: -0.01em; color: var(--text-primary); }
.modal-close {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md); cursor: pointer; border: none; background: none;
  color: var(--text-quaternary); transition: background 120ms, color 120ms;
}
.modal-close:hover { background: var(--bg-subtle); color: var(--text-primary); }
.modal-body { font: var(--text-body); color: var(--text-secondary); margin-bottom: var(--sp-8); line-height: 1.55; }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--sp-2); }

/* ── EMPTY STATE ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: var(--sp-16) var(--sp-8); text-align: center; gap: var(--sp-3);
}
.empty-state-icon { color: var(--text-quaternary); margin-bottom: var(--sp-1); }
.empty-state-title { font: var(--text-h4); color: var(--text-primary); }
.empty-state-desc { font: var(--text-body-s); color: var(--text-tertiary); max-width: 280px; }

/* ── SKELETON ── */
.skeleton {
  background: var(--bg-muted); border-radius: var(--radius-sm);
  animation: skeleton-pulse 1.5s ease-in-out infinite;
}
@keyframes skeleton-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ── MICROCOMPONENTS ── */
.theme-toggle {
  display: flex; align-items: center;
  background: var(--bg-subtle); border: var(--border-width) solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 2px; gap: 2px;
}
.theme-toggle-opt {
  width: 30px; height: 26px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm); cursor: pointer; border: none; background: none;
  color: var(--text-quaternary); transition: background 120ms, color 120ms, box-shadow 120ms;
}
.theme-toggle-opt.active {
  background: var(--bg-surface); color: var(--text-primary);
  box-shadow: var(--shadow-sm);
}

.twin-status {
  display: inline-flex; align-items: center; gap: 6px;
  font: var(--text-body-s);
}
.twin-status-dot { width: 6px; height: 6px; border-radius: var(--radius-full); flex-shrink: 0; }
.twin-status-dot.generated { background: var(--accent-primary); }
.twin-status-dot.validated { background: var(--success); }
.twin-status-dot.pending { background: var(--text-quaternary); }
.twin-status-dot.outdated { background: var(--warning); }

.sim-cost {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: 4px var(--sp-2); border-radius: var(--radius-full);
  background: var(--bg-subtle); border: var(--border-width) solid var(--border-subtle);
  font: var(--text-mono); font-size: 12px; color: var(--text-secondary);
  cursor: default; position: relative;
}
.sim-cost-icon { color: var(--accent-primary); }

/* ── SECTION HIGHLIGHT (left accent) ── */
.accent-left {
  border-left: 2px solid var(--accent-primary); padding-left: var(--sp-3);
}

/* ── MISC ── */
.demo-surface { background: var(--bg-surface); border: var(--border-width) solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--sp-6); }
.ds-token-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) 0; border-bottom: var(--border-width) solid var(--border-subtle); }
.ds-token-name { font: var(--text-mono); font-size: 12px; color: var(--text-tertiary); width: 180px; flex-shrink: 0; }
.ds-token-value { font: var(--text-mono); font-size: 12px; color: var(--text-primary); flex: 1; }
.ds-token-preview { flex-shrink: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Icon helper ──
function Icon({ name, size = 16, strokeWidth = 1.5, style = {}, className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const icon = lucide.createElement(lucide[toPascalCase(name)]);
      if (icon) {
        icon.setAttribute("width", size);
        icon.setAttribute("height", size);
        icon.setAttribute("stroke-width", strokeWidth);
        ref.current.appendChild(icon);
      }
    }
  }, [name, size, strokeWidth]);
  return <span ref={ref} style={{ display: "inline-flex", alignItems: "center", ...style }} className={className} />;
}
function toPascalCase(str) {
  return str.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join("");
}

                { name: "H3", size: "18px", weight: "600", ls: "-0.01em", lh: "1.3", sample: "Publicaciones recientes" },

                { name: "Body L", size: "16px", weight: "400", ls: "0", lh: "1.55", sample: "IntellectClone construye réplicas digitales de la comunidad académica." },
                { name: "Body", size: "14px", weight: "400", ls: "0", lh: "1.5", sample: "Texto general de interfaz. Labels, descripciones, metadatos de navegación." },
                { name: "Body S", size: "13px", weight: "400", ls: "0", lh: "1.45", sample: "Metadatos, descripciones auxiliares, información de tabla." },
                { name: "Caption", size: "12px", weight: "500", ls: "0", lh: "1.4", sample: "Labels, badges, encabezados de columna" },
                { name: "Eyebrow", size: "11px", weight: "500", ls: "0.12em", lh: "1.4", sample: "SECCIÓN DE PORTADA", upper: true },
                { name: "Mono L", size: "14px", weight: "500", ls: "0", lh: "1.4", sample: "1,284 citas · índice h: 21", mono: true },
                { name: "Mono", size: "13px", weight: "400", ls: "0", lh: "1.4", sample: "INV-2024-0047 · 84 papers", mono: true },
              ].map(t => (
                <div key={t.name} className="type-specimen-row">
                  <div>
                    <div className="type-specimen-meta">{t.name}</div>
                    <div className="type-specimen-meta">{t.size} / {t.weight}</div>
                  </div>
                  <div style={{
                    fontSize: t.size, fontWeight: t.weight, letterSpacing: t.ls, lineHeight: t.lh,
                    fontFamily: t.mono ? "var(--font-mono)" : "var(--font-sans)",
                    textTransform: t.upper ? "uppercase" : "none",
                    color: "var(--text-primary)",
                  }}>
                    {t.sample}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* TOKENS: SPACING */}
        {section === "tokens-spacing" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Tokens</div>
            <h2 className="ds-section-title">Espaciado & radios</h2>
            <p className="ds-section-desc">Múltiplos de 4px. Radios pequeños: Quirúrgico es preciso, no redondeado.</p>
            <div>
              <div className="ds-row-label">Escala de espaciado</div>
              {SPACING.map(s => (
                <div key={s} className="ds-token-row">
                  <div className="ds-token-name">--sp-{s/4 < 1 ? s : s/4 >= 10 ? s/4 * 4 : s/4}</div>
                  <div className="ds-token-value">{s}px</div>
                  <div className="ds-token-preview">
                    <div style={{ height: 8, width: s, background: "var(--accent-primary)", borderRadius: 2 }} />
                  </div>
                </div>
              ))}
            </div>
            <div className="ds-divider" />
            <div>
              <div className="ds-row-label">Radios</div>
              {[
                { name: "radius-none", val: "0px" },
                { name: "radius-sm", val: "4px" },
                { name: "radius-md", val: "6px" },
                { name: "radius-lg", val: "8px" },
                { name: "radius-xl", val: "12px" },
                { name: "radius-full", val: "9999px" },
              ].map(r => (
                <div key={r.name} className="ds-token-row">
                  <div className="ds-token-name">--{r.name}</div>
                  <div className="ds-token-value">{r.val}</div>
                  <div className="ds-token-preview">
                    <div style={{ width: 40, height: 24, background: "var(--bg-muted)", borderRadius: r.val, border: "var(--border-width) solid var(--border-default)" }} />
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* COMPONENTS: BUTTONS */}
        {section === "comp-buttons" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Componentes</div>
            <h2 className="ds-section-title">Botones</h2>
            <p className="ds-section-desc">Un botón primary por pantalla, máximo dos. El cobalto como acción de máxima jerarquía.</p>
            <div className="ds-row-label">Variantes × tamaños</div>
            {[
              { label: "Primary", v: "primary" },
              { label: "Secondary", v: "secondary" },
              { label: "Ghost", v: "ghost" },
              { label: "Destructive", v: "destructive" },
            ].map(({ label, v }) => (
              <div key={v} style={{ marginBottom: "var(--sp-4)" }}>
                <div className="ds-row-label">{label}</div>
                <div style={{ display: "flex", gap: "var(--sp-3)", alignItems: "center", flexWrap: "wrap" }}>
                  <Btn variant={v} size="sm">Small</Btn>
                  <Btn variant={v} size="md">Medium</Btn>
                  <Btn variant={v} size="lg">Large</Btn>
                  <Btn variant={v} icon="plus">Con ícono</Btn>
                  <Btn variant={v} disabled>Disabled</Btn>
                  <Btn variant={v} loading>Loading</Btn>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* COMPONENTS: INPUTS */}
        {section === "comp-inputs" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Componentes</div>
            <h2 className="ds-section-title">Inputs</h2>
            <p className="ds-section-desc">Label en eyebrow style. Focus ring cobalto. Borde retina-thin.</p>
            <InputDemo />
          </div>
        )}

        {/* COMPONENTS: TAGS */}
        {section === "comp-tags" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Componentes</div>
            <h2 className="ds-section-title">Tags & Pills</h2>
            <p className="ds-section-desc">Semánticos restringidos a feedback del sistema. Para categorías y áreas: siempre neutral.</p>
            <TagsDemo />
          </div>
        )}

        {/* COMPONENTS: AVATARS */}
        {section === "comp-avatars" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Componentes</div>
            <h2 className="ds-section-title">Avatares</h2>
            <p className="ds-section-desc">Iniciales sobre bg-subtle. El usuario activo usa accent-subtle. Sin colores aleatorios.</p>
            <div>
              <div className="ds-row-label">Tamaños (usuario estándar)</div>
              <div style={{ display: "flex", gap: "var(--sp-4)", alignItems: "flex-end" }}>
                {[["xs", "MC"], ["sm", "MC"], ["md", "MC"], ["lg", "MC"], ["xl", "MC"]].map(([s, init]) => (
                  <div key={s} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "var(--sp-2)" }}>
                    <AvatarComp size={s} initial={init} />
                    <span style={{ font: "var(--text-caption)", color: "var(--text-quaternary)" }}>{s}</span>
                  </div>
                ))}
              </div>
              <div style={{ marginTop: "var(--sp-6)" }}>
                <div className="ds-row-label">Usuario activo (accent-subtle)</div>
                <div style={{ display: "flex", gap: "var(--sp-4)", alignItems: "flex-end" }}>
                  {[["xs", "RC"], ["sm", "RC"], ["md", "RC"], ["lg", "RC"], ["xl", "RC"]].map(([s, init]) => (
                    <div key={s} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "var(--sp-2)" }}>
                      <AvatarComp size={s} initial={init} self />
                      <span style={{ font: "var(--text-caption)", color: "var(--text-quaternary)" }}>{s}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* COMPONENTS: CARDS */}
        {section === "comp-cards" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Componentes</div>
            <h2 className="ds-section-title">Cards</h2>
            <p className="ds-section-desc">Planas por defecto, sin sombra. La sombra indica elevación funcional: modales, dropdowns.</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))", gap: "var(--sp-4)", marginBottom: "var(--sp-8)" }}>
              <div>
                <div className="ds-row-label">Surface card</div>
                <div className="card" style={{ padding: "var(--sp-5)" }}>
                  <div style={{ font: "var(--text-h4)", color: "var(--text-primary)", marginBottom: "var(--sp-2)" }}>Dra. María Elena Cárdenas</div>
                  <div style={{ font: "var(--text-body-s)", color: "var(--text-tertiary)" }}>Facultad de Ingeniería · SNII II</div>
                </div>
              </div>
              <div>
                <div className="ds-row-label">Subtle card</div>
                <div className="card-subtle" style={{ padding: "var(--sp-5)" }}>
                  <div style={{ font: "var(--text-h4)", color: "var(--text-primary)", marginBottom: "var(--sp-2)" }}>Cuerpo académico</div>
                  <div style={{ font: "var(--text-body-s)", color: "var(--text-tertiary)" }}>Redes de Computadoras · Consolidado</div>
                </div>
              </div>
              <div>
                <div className="ds-row-label">Highlighted card</div>
                <div className="card-highlighted" style={{ padding: "var(--sp-5)" }}>
                  <div style={{ font: "var(--text-h4)", color: "var(--text-primary)", marginBottom: "var(--sp-2)" }}>Seleccionado</div>
                  <div style={{ font: "var(--text-body-s)", color: "var(--text-tertiary)" }}>Este investigador está incluido en la simulación.</div>
                </div>
              </div>
            </div>
            <div className="ds-row-label">Stat cards (métricas)</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "var(--sp-3)" }}>
              <StatCard eyebrow="Publicaciones" value="84" delta="+6 este año" />
              <StatCard eyebrow="Citas" value="1,284" delta="+143 este año" />
              <StatCard eyebrow="Índice h" value="21" />
              <StatCard eyebrow="Coautores UAT" value="37" delta="+3 nuevos" />
            </div>
          </div>
        )}

        {/* COMPONENTS: NAV */}
        {section === "comp-nav" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Componentes</div>
            <h2 className="ds-section-title">Navegación</h2>
            <p className="ds-section-desc">Top bar para zonas públicas. Side nav para zonas privadas. Tabs sin pills ni boxes.</p>
            <NavDemo />
          </div>
        )}

        {/* COMPONENTS: TABLES */}
        {section === "comp-tables" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Componentes</div>
            <h2 className="ds-section-title">Tablas</h2>
            <p className="ds-section-desc">Densidad alta en zonas operativas: 40px por fila. Acciones en hover, alineadas a la derecha.</p>
            <TableDemo />
          </div>
        )}

        {/* COMPONENTS: MODALS */}
        {section === "comp-modals" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Componentes</div>
            <h2 className="ds-section-title">Modales</h2>
            <p className="ds-section-desc">Overlay semitransparente + blur sutil. Contenedor máx 560px, padding 32px, radio 12px.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: "var(--sp-4)" }}>
              <ModalDemo />
              <div className="ds-row-label">Vista estática del modal</div>
              <div style={{ position: "relative", background: "var(--bg-subtle)", borderRadius: "var(--radius-lg)", padding: "var(--sp-10)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <div className="modal" style={{ position: "relative", boxShadow: "var(--shadow-lg)" }}>
                  <div className="modal-header">
                    <h3 className="modal-title">Confirmar simulación</h3>
                    <button className="modal-close"><Icon name="x" size={14} /></button>
                  </div>
                  <div className="modal-body">
                    Esta simulación incluye <strong style={{ color: "var(--text-primary)" }}>187 gemelos</strong> y tiene un costo estimado de <span style={{ fontFamily: "var(--font-mono)", fontWeight: 500 }}>$2.40 USD</span>. ¿Deseas continuar?
                  </div>
                  <div className="modal-footer">
                    <Btn variant="ghost">Cancelar</Btn>
                    <Btn variant="primary" icon="zap">Lanzar simulación</Btn>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* COMPONENTS: STATES */}
        {section === "comp-states" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Componentes</div>
            <h2 className="ds-section-title">Estados especiales</h2>
            <p className="ds-section-desc">Skeleton en lugar de spinners genéricos. Empty states con acción clara.</p>
            <StatesDemo />
            <div className="ds-divider" />
            <div className="ds-row-label">Estado de error</div>
            <div className="demo-surface" style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "var(--sp-3)", padding: "var(--sp-10)" }}>
              <div style={{ color: "var(--danger)" }}><Icon name="alert-triangle" size={32} strokeWidth={1.25} /></div>
              <div style={{ font: "var(--text-h4)", color: "var(--text-primary)" }}>Error al conectar con el sistema</div>
              <div style={{ font: "var(--text-body-s)", color: "var(--text-tertiary)", textAlign: "center", maxWidth: 260 }}>No fue posible cargar los datos del cosechador. Verifica la conexión e intenta de nuevo.</div>
              <Btn variant="secondary" size="sm" icon="refresh-cw">Reintentar</Btn>
            </div>
          </div>
        )}

        {/* COMPONENTS: MICRO */}
        {section === "comp-micro" && (
          <div className="ds-section">
            <div className="ds-section-eyebrow">Componentes</div>
            <h2 className="ds-section-title">Microcomponentes</h2>
            <p className="ds-section-desc">Toggle de modo, indicadores de estado del gemelo, costo de simulación, breadcrumbs, tabs, acento izquierdo.</p>
            <MicroDemo />
          </div>
        )}
      </main>

      <ModeToggle theme={theme} setTheme={setTheme} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DesignSystem />);
</script>
</body>
</html>
