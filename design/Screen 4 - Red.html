function Icon({ name, size = 16, strokeWidth = 1.5 }) {
  const ref = useRef(null);

      const key = name.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join("");
      const el = lucide.createElement(lucide[key]);

  }, [name, size]);
  return <span ref={ref} style={{ display: "inline-flex", alignItems: "center" }} />;
}

function NetworkGraph({ nodes, edges, selected, onSelect, theme }) {
  const svgRef = useRef(null);
  const simRef = useRef(null);
  const zoomRef = useRef(null);

  const isDark = theme === "dark";

  const rScale = d3.scaleLinear()
    .domain([d3.min(nodes, d => d.papers), d3.max(nodes, d => d.papers)])
    .range([7, 22]);

  const wScale = d3.scaleLinear()
    .domain([1, 8]).range([0.5, 3.5]);

  useEffect(() => {
    if (!svgRef.current || !nodes.length) return;
    const container = svgRef.current.parentElement;
    const W = container.clientWidth;
    const H = container.clientHeight;

    d3.select(svgRef.current).selectAll("*").remove();

    const svg = d3.select(svgRef.current)
      .attr("width", W).attr("height", H);

    const g = svg.append("g");

    // Zoom
    const zoom = d3.zoom()
      .scaleExtent([0.3, 3])
      .on("zoom", (event) => { g.attr("transform", event.transform); });
    svg.call(zoom);
    zoomRef.current = zoom;

    // Edge color
    const edgeColor = isDark ? "#3A3A37" : "#D4D2C9";
    const nodeStroke = isDark ? "#3A3A37" : "#D4D2C9";
    const textFill = isDark ? "#888780" : "#6B6B68";
    const highlightFill = isDark ? "#1A2540" : "#E8EDF7";
    const highlightStroke = isDark ? "#6B8FE0" : "#1E3A8A";

    // Clone for simulation
    const simNodes = nodes.map(d => ({ ...d }));
    const nodeById = Object.fromEntries(simNodes.map(d => [d.id, d]));
    const simEdges = edges.map(e => ({
      source: nodeById[e.source] || e.source,
      target: nodeById[e.target] || e.target,
      weight: e.weight,
    }));

    // Simulation
    const sim = d3.forceSimulation(simNodes)
      .force("link", d3.forceLink(simEdges).id(d => d.id).distance(d => 60 + (rScale(d.source.papers || 30) + rScale(d.target.papers || 30)) * 2))
      .force("charge", d3.forceManyBody().strength(-180))
      .force("center", d3.forceCenter(W / 2, H / 2))
      .force("collision", d3.forceCollide(d => rScale(d.papers) + 4));
    simRef.current = sim;

    // Edges
    const link = g.append("g").selectAll("line")
      .data(simEdges).join("line")
      .attr("stroke", edgeColor)
      .attr("stroke-width", d => wScale(d.weight))
      .attr("stroke-opacity", 0.7);

    // Nodes group
    const node = g.append("g").selectAll("g")
      .data(simNodes).join("g")
      .attr("cursor", "pointer")
      .call(d3.drag()
        .on("start", (event, d) => { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on("end", (event, d) => { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
      )
      .on("click", (event, d) => { event.stopPropagation(); onSelect(d.id === selected ? null : d.id); });

    node.append("circle")
      .attr("r", d => rScale(d.papers))
      .attr("fill", d => d.id === selected ? highlightFill : (isDark ? "#252522" : "#F4F3EE"))
      .attr("stroke", d => d.id === selected ? highlightStroke : nodeStroke)
      .attr("stroke-width", d => d.id === selected ? 2 : 1);

    node.append("text")
      .text(d => d.id)
      .attr("text-anchor", "middle")
      .attr("dominant-baseline", "middle")
      .attr("font-size", d => Math.max(7, rScale(d.papers) * 0.6))
      .attr("font-family", "var(--font-sans)")
      .attr("font-weight", "500")
      .attr("fill", d => d.id === selected ? highlightStroke : textFill)
      .attr("pointer-events", "none");

    svg.on("click", () => onSelect(null));

    sim.on("tick", () => {
      link
        .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    return () => { sim.stop(); };
  }, [nodes, edges, theme]);

  // Re-highlight selected node without re-running simulation
  useEffect(() => {
    if (!svgRef.current) return;
    const isDark = theme === "dark";
    const highlightFill = isDark ? "#1A2540" : "#E8EDF7";
    const highlightStroke = isDark ? "#6B8FE0" : "#1E3A8A";
    const normalFill = isDark ? "#252522" : "#F4F3EE";
    const normalStroke = isDark ? "#3A3A37" : "#D4D2C9";
    const normalText = isDark ? "#888780" : "#6B6B68";

    d3.select(svgRef.current).selectAll("g g g").each(function(d) {
      if (!d) return;
      const isSelected = d.id === selected;
      d3.select(this).select("circle")
        .attr("fill", isSelected ? highlightFill : normalFill)
        .attr("stroke", isSelected ? highlightStroke : normalStroke)
        .attr("stroke-width", isSelected ? 2 : 1);
      d3.select(this).select("text")
        .attr("fill", isSelected ? highlightStroke : normalText);
    });
  }, [selected, theme]);

  const handleZoomIn  = () => { if (svgRef.current && zoomRef.current) d3.select(svgRef.current).transition().call(zoomRef.current.scaleBy, 1.4); };
  const handleZoomOut = () => { if (svgRef.current && zoomRef.current) d3.select(svgRef.current).transition().call(zoomRef.current.scaleBy, 0.7); };
  const handleReset   = () => { if (svgRef.current && zoomRef.current) d3.select(svgRef.current).transition().call(zoomRef.current.transform, d3.zoomIdentity); };

  return (
    <div style={{ position: "relative", width: "100%", height: "100%" }}>
      <svg ref={svgRef} className="net-svg" />
      <div className="net-controls">
        <button className="ctrl-btn" onClick={handleZoomIn} title="Acercar"><Icon name="plus" size={14} /></button>
        <button className="ctrl-btn" onClick={handleZoomOut} title="Alejar"><Icon name="minus" size={14} /></button>
        <button className="ctrl-btn" onClick={handleReset} title="Restablecer vista"><Icon name="maximize-2" size={14} /></button>
        <button className="ctrl-btn" title="Exportar"><Icon name="download" size={14} /></button>
      </div>
    </div>
  );
}

                <div className="legend-dot" style={{ background: dep === filterDep || filterDep === "Todas" ? color : "var(--bg-muted)" }} />
                <div className="legend-label" style={{ color: dep === filterDep || filterDep === "Todas" ? "var(--text-secondary)" : "var(--text-quaternary)" }}>{dep}</div>
              </div>
            ))}
            <div className="size-legend">
              {[8, 14, 20].map(r => (
                <div key={r} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                  <div className="size-demo" style={{ width: r * 2, height: r * 2 }} />
                  <span style={{ fontFamily: "var(--font-sans)", fontSize: 10, color: "var(--text-quaternary)" }}>{r < 10 ? "< 30" : r < 16 ? "30–80" : "> 80"} papers</span>
                </div>
              ))}
            </div>
          </div>

          {/* Selected */}
          <div className="panel-section" style={{ flex: 1 }}>
            <div className="panel-section-title">
              {selectedNode ? "Investigador seleccionado" : "Ningún nodo seleccionado"}
            </div>
            {selectedNode ? (
              <div className="person-card">
                <div style={{ display: "flex", alignItems: "center", gap: "var(--sp-3)" }}>
                  <div className="avatar avatar-md" style={{ background: "var(--accent-subtle)", color: "var(--accent-text)" }}>{selectedNode.id}</div>
                  <div>
                    <div className="person-name">{selectedNode.name}</div>
                    <div className="person-dep">{selectedNode.dep} · SNII {selectedNode.snii}</div>
                  </div>
                </div>
                <div className="person-stats">
                  <div className="p-stat">
                    <div className="p-stat-val">{selectedNode.papers}</div>
                    <div className="p-stat-lbl">publicaciones</div>
                  </div>
                  <div className="p-stat">
                    <div className="p-stat-val">{selectedNode.citas.toLocaleString()}</div>
                    <div className="p-stat-lbl">citas</div>
                  </div>
                  <div className="p-stat">
                    <div className="p-stat-val">{collaboratorCount}</div>
                    <div className="p-stat-lbl">coautores</div>
                  </div>
                  <div className="p-stat">
                    <div className="p-stat-val" style={{ display: "flex", alignItems: "center", gap: 4 }}>
                      <span className="twin-dot generated" />
                      <span style={{ fontSize: 12, color: "var(--accent-primary)" }}>Gemelo</span>
                    </div>
                    <div className="p-stat-lbl">estado</div>
                  </div>
                </div>
                <a href="Screen 3 - Perfil.html" className="btn btn-secondary btn-sm" style={{ textDecoration: "none", justifyContent: "center" }}>
                  Ver perfil completo
                  <Icon name="arrow-right" size={13} />
                </a>
              </div>
            ) : (
              <div style={{ fontFamily: "var(--font-sans)", fontSize: 13, color: "var(--text-quaternary)" }}>
                Haz clic en un nodo para ver la información del investigador.
              </div>
            )}
          </div>
        </aside>
      </div>

      <ModeToggle theme={theme} setTheme={setTheme} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<NetworkApp />);
</script>
</body>
</html>
