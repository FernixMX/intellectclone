<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IntellectClone — Simulador</title>
<link rel="stylesheet" href="screens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
.sim-layout {
  display: flex; min-height: calc(100vh - 56px);
}
/* Left: editor */
.sim-editor {
  flex: 3; padding: var(--sp-8);
  border-right: var(--border-width) solid var(--border-subtle);
  display: flex; flex-direction: column; gap: var(--sp-6);
  overflow-y: auto;
}
.sim-editor-title {
  font-family: var(--font-sans); font-size: 18px; font-weight: 600;
  letter-spacing: -0.01em; color: var(--text-primary);
}
.sim-section-label {
  font-family: var(--font-sans); font-size: 11px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-quaternary);
  margin-bottom: var(--sp-2);
}
.scenario-textarea {
  width: 100%; min-height: 180px; padding: var(--sp-4);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.65;
  color: var(--text-primary); background: var(--bg-surface);
  border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-lg); outline: none; resize: vertical;
  transition: border-color 120ms, box-shadow 120ms;
}
.scenario-textarea:focus { border-color: var(--accent-primary); box-shadow: var(--shadow-focus); }
.scenario-textarea::placeholder { color: var(--text-quaternary); }

.options-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--sp-4); }
.option-group { display: flex; flex-direction: column; gap: var(--sp-1); }
.option-label {
  font-family: var(--font-sans); font-size: 11px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-quaternary);
}
.option-select {
  height: 36px; padding: 0 30px 0 10px;
  font-family: var(--font-sans); font-size: 13px;
  color: var(--text-primary); background: var(--bg-surface);
  border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-md); appearance: none; outline: none; cursor: pointer;
  transition: border-color 120ms;
}
.option-select:focus { border-color: var(--accent-primary); }
.option-sel-wrap { position: relative; }
.option-chevron { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--text-quaternary); pointer-events: none; }

/* Right: cohort */
.sim-cohort {
  flex: 2; padding: var(--sp-8);
  display: flex; flex-direction: column; gap: var(--sp-5);
  background: var(--bg-subtle); overflow-y: auto;
}
.cohort-title {
  font-family: var(--font-sans); font-size: 16px; font-weight: 600;
  letter-spacing: -0.005em; color: var(--text-primary);
}
.cohort-counter {
  background: var(--bg-surface); border: var(--border-width) solid var(--border-subtle);
  border-radius: var(--radius-lg); padding: var(--sp-4) var(--sp-5);
  display: flex; align-items: center; gap: var(--sp-4);
}
.counter-num {
  font-family: var(--font-mono); font-size: 40px; font-weight: 600;
  color: var(--accent-primary); line-height: 1;
}
.counter-label {
  font-family: var(--font-sans); font-size: 14px; color: var(--text-secondary); line-height: 1.4;
}
.filter-stack { display: flex; flex-direction: column; gap: var(--sp-3); }
.filter-chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip {
  padding: 4px 10px; border-radius: var(--radius-sm);
  font-family: var(--font-sans); font-size: 12px; font-weight: 500;
  border: var(--border-width) solid var(--border-default);
  color: var(--text-secondary); cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms;
  background: var(--bg-surface);
}
.fchip:hover { background: var(--bg-muted); }
.fchip.active { background: var(--accent-subtle); border-color: var(--accent-primary); color: var(--accent-text); }

/* Cost / time estimate */
.estimate-block {
  background: var(--bg-surface); border: var(--border-width) solid var(--border-subtle);
  border-radius: var(--radius-lg); padding: var(--sp-4) var(--sp-5);
  display: flex; flex-direction: column; gap: var(--sp-3);
}
.estimate-row { display: flex; align-items: center; justify-content: space-between; }
.estimate-label { font-family: var(--font-sans); font-size: 13px; color: var(--text-tertiary); }
.estimate-val { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text-primary); }
.estimate-warn {
  display: flex; align-items: center; gap: var(--sp-2);
  font-family: var(--font-sans); font-size: 12px; color: var(--warning);
  padding: var(--sp-2) var(--sp-3);
  background: var(--warning-subtle); border-radius: var(--radius-md);
}

/* Bottom actions */
.sim-actions {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-5) var(--sp-8);
  border-top: var(--border-width) solid var(--border-subtle);
  background: var(--bg-base);
}

/* Confirm modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(10,10,10,0.6);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--bg-surface); border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-xl); padding: var(--sp-8); width: 100%; max-width: 480px;
  box-shadow: var(--shadow-lg);
}
.modal-title { font-family: var(--font-sans); font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: var(--sp-4); }
.modal-body { font-family: var(--font-sans); font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: var(--sp-6); }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--sp-2); }
.modal-close-btn {
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md); cursor: pointer; border: none; background: none;
  color: var(--text-quaternary);
}
.modal-close-btn:hover { background: var(--bg-subtle); }

/* Loading state */
.loading-overlay {
  position: fixed; inset: 0; background: rgba(10,10,10,0.6);
  display: flex; align-items: center; justify-content: center; z-index: 200;
  backdrop-filter: blur(2px);
}
.loading-card {
  background: var(--bg-surface); border-radius: var(--radius-xl);
  padding: var(--sp-10) var(--sp-12);
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-4);
  box-shadow: var(--shadow-lg);
}
.spinner-ring {
  width: 40px; height: 40px;
  border: 3px solid var(--bg-muted);
  border-top-color: var(--accent-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

function Icon({ name, size = 16, strokeWidth = 1.5 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const key = name.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join("");
      const el = lucide.createElement(lucide[key]);
      if (el) { el.setAttribute("width", size); el.setAttribute("height", size); el.setAttribute("stroke-width", strokeWidth); ref.current.appendChild(el); }
    }
  }, [name, size]);
  return <span ref={ref} style={{ display: "inline-flex", alignItems: "center" }} />;
}

function ModeToggle({ theme, setTheme }) {
  return (
    <div className="mode-toggle-fixed">
      <button className={`mt-btn ${theme === "light" ? "active" : ""}`} onClick={() => setTheme("light")}><Icon name="sun" size={13} /></button>
      <button className={`mt-btn ${theme === "dark" ? "active" : ""}`} onClick={() => setTheme("dark")}><Icon name="moon" size={13} /></button>
    </div>
  );
}

const DEPS_FULL = { "Todas": 612, "Ingeniería": 148, "Medicina": 112, "UAMRR": 98, "Derecho": 74, "Educación": 61, "Comercio": 55, "Mante": 64 };
const SNII_COUNTS = { "Todos": 612, "C": 231, "I": 187, "II": 134, "III": 60 };
const AREAS_COUNTS = { "Todas": 612, "Ciencias Exactas": 201, "Ciencias de la Salud": 178, "Ciencias Sociales": 142, "Humanidades": 91 };

function Simulador() {
  const [theme, setTheme] = useState(() => localStorage.getItem("ic-theme") || "light");
  const [scenario, setScenario] = useState("");
  const [tone, setTone] = useState("académico");
  const [lang, setLang] = useState("español");
  const [format, setFormat] = useState("estructurado");
  const [filterDep, setFilterDep] = useState("Todas");
  const [filterSnii, setFilterSnii] = useState("Todos");
  const [filterArea, setFilterArea] = useState("Todas");
  const [showConfirm, setShowConfirm] = useState(false);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("ic-theme", theme);
  }, [theme]);

  // Simulated cohort count
  const cohortCount = useMemo(() => {
    let base = 612;
    if (filterDep !== "Todas") base = Math.min(base, DEPS_FULL[filterDep]);
    if (filterSnii !== "Todos") base = Math.floor(base * (SNII_COUNTS[filterSnii] / 612));
    if (filterArea !== "Todas") base = Math.floor(base * (AREAS_COUNTS[filterArea] / 612));
    return Math.max(1, base);
  }, [filterDep, filterSnii, filterArea]);

  const costPerTwin = 0.013;
  const estimatedCost = (cohortCount * costPerTwin).toFixed(2);
  const estimatedMin = Math.ceil(cohortCount * 0.018);
  const isExpensive = parseFloat(estimatedCost) > 5;
  const canLaunch = scenario.trim().length > 20;

  const handleLaunch = () => {
    if (!canLaunch) return;
    setShowConfirm(true);
  };

  const handleConfirm = () => {
    setShowConfirm(false);
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      window.location.href = "Screen 7 - Resultado.html";
    }, 2800);
  };

  return (
    <div className="page" style={{ minHeight: "100vh" }}>
      <header className="topbar">
        <a className="logo" href="Screen 1 - Home.html">
          <span className="logo-uat">UAT</span>
          <span className="logo-sub">IntellectClone</span>
        </a>
        <div style={{ display: "flex", alignItems: "center", gap: "var(--sp-3)", marginLeft: "var(--sp-6)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "var(--sp-2)" }}>
            <Icon name="cpu" size={14} />
            <span style={{ fontFamily: "var(--font-sans)", fontSize: 13, fontWeight: 600, color: "var(--text-primary)" }}>Simulador</span>
          </div>
          <span style={{ color: "var(--border-strong)", fontSize: 16 }}>/</span>
          <span style={{ fontFamily: "var(--font-sans)", fontSize: 13, color: "var(--text-tertiary)" }}>Nuevo escenario</span>
        </div>
        <div className="topbar-actions">
          <div className="avatar avatar-sm avatar-self">RC</div>
          <span style={{ fontFamily: "var(--font-sans)", fontSize: 13, color: "var(--text-secondary)" }}>Rectoría</span>
        </div>
      </header>

      <div style={{ display: "flex", flexDirection: "column", flex: 1 }}>
        <div className="sim-layout" style={{ flex: 1 }}>
          {/* Editor */}
          <div className="sim-editor">
            <div>
              <div className="sim-section-label">Escenario</div>
              <div className="sim-editor-title">¿Qué quieres preguntar a la comunidad académica?</div>
            </div>

            <div>
              <textarea
                className="scenario-textarea"
                placeholder="Describe el escenario o pregunta que quieres simular. Ejemplo: «La Universidad está considerando adoptar un modelo de educación híbrida permanente para todos los programas de licenciatura a partir de 2026. ¿Qué postura tendría la comunidad académica ante esta decisión?»"
                value={scenario}
                onChange={e => setScenario(e.target.value)}
              />
              <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 6 }}>
                <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: scenario.length > 20 ? "var(--text-quaternary)" : "var(--danger)" }}>
                  {scenario.length} caracteres {scenario.length < 20 && "· mínimo 20"}
                </span>
              </div>
            </div>

            <div>
              <div className="sim-section-label" style={{ marginBottom: "var(--sp-3)" }}>Opciones avanzadas</div>
              <div className="options-grid">
                <div className="option-group">
                  <div className="option-label">Tono de respuesta</div>
                  <div className="option-sel-wrap">
                    <select className="option-select" style={{ width: "100%" }} value={tone} onChange={e => setTone(e.target.value)}>
                      <option>académico</option>
                      <option>directo</option>
                      <option>deliberativo</option>
                      <option>neutral</option>
                    </select>
                    <span className="option-chevron"><Icon name="chevron-down" size={13} /></span>
                  </div>
                </div>
                <div className="option-group">
                  <div className="option-label">Idioma</div>
                  <div className="option-sel-wrap">
                    <select className="option-select" style={{ width: "100%" }} value={lang} onChange={e => setLang(e.target.value)}>
                      <option>español</option>
                      <option>inglés</option>
                      <option>bilingüe</option>
                    </select>
                    <span className="option-chevron"><Icon name="chevron-down" size={13} /></span>
                  </div>
                </div>
                <div className="option-group">
                  <div className="option-label">Formato de salida</div>
                  <div className="option-sel-wrap">
                    <select className="option-select" style={{ width: "100%" }} value={format} onChange={e => setFormat(e.target.value)}>
                      <option>estructurado</option>
                      <option>narrativo</option>
                      <option>tabular</option>
                    </select>
                    <span className="option-chevron"><Icon name="chevron-down" size={13} /></span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Cohort panel */}
          <div className="sim-cohort">
            <div className="cohort-title">Selección de cohorte</div>

            <div className="cohort-counter">
              <div className="counter-num">{cohortCount.toLocaleString()}</div>
              <div>
                <div className="counter-label" style={{ fontWeight: 500, color: "var(--text-primary)" }}>gemelos seleccionados</div>
                <div style={{ fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--text-quaternary)", marginTop: 2 }}>de 612 disponibles en v1</div>
              </div>
            </div>

            <div className="filter-stack">
              <div>
                <div className="sim-section-label">Dependencia</div>
                <div className="filter-chip-group">
                  {Object.keys(DEPS_FULL).map(d => (
                    <button key={d} className={`fchip ${filterDep === d ? "active" : ""}`} onClick={() => setFilterDep(d)}>
                      {d} <span style={{ fontFamily: "var(--font-mono)", fontSize: 10, marginLeft: 3, opacity: 0.7 }}>{DEPS_FULL[d]}</span>
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <div className="sim-section-label">Nivel SNII</div>
                <div className="filter-chip-group">
                  {Object.keys(SNII_COUNTS).map(s => (
                    <button key={s} className={`fchip ${filterSnii === s ? "active" : ""}`} onClick={() => setFilterSnii(s)}>{s}</button>
                  ))}
                </div>
              </div>
              <div>
                <div className="sim-section-label">Área de conocimiento</div>
                <div className="filter-chip-group">
                  {Object.keys(AREAS_COUNTS).map(a => (
                    <button key={a} className={`fchip ${filterArea === a ? "active" : ""}`} onClick={() => setFilterArea(a)}>{a}</button>
                  ))}
                </div>
              </div>
            </div>

            <div className="estimate-block">
              <div className="estimate-row">
                <span className="estimate-label">Costo estimado</span>
                <span className="estimate-val" style={{ color: isExpensive ? "var(--warning)" : "var(--text-primary)" }}>${estimatedCost} USD</span>
              </div>
              <div className="estimate-row">
                <span className="estimate-label">Tiempo estimado</span>
                <span className="estimate-val">~{estimatedMin} min</span>
              </div>
              <div className="estimate-row">
                <span className="estimate-label">Gemelos</span>
                <span className="estimate-val">{cohortCount.toLocaleString()} agentes</span>
              </div>
              {isExpensive && (
                <div className="estimate-warn">
                  <Icon name="alert-triangle" size={13} />
                  Costo elevado — se pedirá confirmación al lanzar
                </div>
              )}
            </div>
          </div>
        </div>

        {/* Actions bar */}
        <div className="sim-actions">
          <div style={{ flex: 1 }}>
            {!canLaunch && (
              <span style={{ fontFamily: "var(--font-sans)", fontSize: 13, color: "var(--text-quaternary)" }}>
                <Icon name="info" size={13} /> Escribe el escenario para habilitar la simulación (mínimo 20 caracteres)
              </span>
            )}
          </div>
          <button className="btn btn-ghost btn-md">Guardar borrador</button>
          <button
            className="btn btn-primary btn-lg"
            disabled={!canLaunch}
            onClick={handleLaunch}
          >
            <Icon name="zap" size={16} />
            Lanzar simulación
          </button>
        </div>
      </div>

      {/* Confirm modal */}
      {showConfirm && (
        <div className="modal-overlay" onClick={() => setShowConfirm(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "var(--sp-5)" }}>
              <div className="modal-title">Confirmar simulación</div>
              <button className="modal-close-btn" onClick={() => setShowConfirm(false)}><Icon name="x" size={14} /></button>
            </div>
            <div className="modal-body">
              Esta simulación consultará <strong style={{ color: "var(--text-primary)" }}>{cohortCount.toLocaleString()} gemelos digitales</strong> y tiene un costo estimado de <span style={{ fontFamily: "var(--font-mono)", fontWeight: 500 }}>${estimatedCost} USD</span> con una duración aproximada de {estimatedMin} minutos.
              {isExpensive && (
                <div style={{ marginTop: "var(--sp-3)", padding: "var(--sp-3)", background: "var(--warning-subtle)", borderRadius: "var(--radius-md)", color: "var(--warning)", fontSize: 13, display: "flex", gap: "var(--sp-2)", alignItems: "flex-start" }}>
                  <Icon name="alert-triangle" size={14} />
                  El costo supera el umbral de $5 USD configurado para esta cuenta. Confirma que deseas continuar.
                </div>
              )}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost btn-md" onClick={() => setShowConfirm(false)}>Cancelar</button>
              <button className="btn btn-primary btn-md" onClick={handleConfirm}>
                <Icon name="zap" size={14} />
                Confirmar y lanzar
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Loading */}
      {loading && (
        <div className="loading-overlay">
          <div className="loading-card">
            <div className="spinner-ring" />
            <div style={{ fontFamily: "var(--font-sans)", fontSize: 15, fontWeight: 600, color: "var(--text-primary)" }}>Consultando gemelos digitales…</div>
            <div style={{ fontFamily: "var(--font-sans)", fontSize: 13, color: "var(--text-tertiary)" }}>{cohortCount.toLocaleString()} agentes · estimado {estimatedMin} min</div>
          </div>
        </div>
      )}

      <ModeToggle theme={theme} setTheme={setTheme} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Simulador />);
</script>
</body>
</html>
