<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IntellectClone — Directorio</title>
<link rel="stylesheet" href="screens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
.layout { display: flex; min-height: calc(100vh - 56px); }

/* Sidebar */
.filter-sidebar {
  width: 240px; flex-shrink: 0;
  border-right: var(--border-width) solid var(--border-subtle);
  padding: var(--sp-6) var(--sp-4);
  background: var(--bg-surface);
  display: flex; flex-direction: column; gap: var(--sp-6);
  position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
}
.filter-group { display: flex; flex-direction: column; gap: var(--sp-3); }
.filter-label {
  font-family: var(--font-sans); font-size: 11px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-quaternary);
}
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 4px 10px; border-radius: var(--radius-sm);
  font-family: var(--font-sans); font-size: 12px; font-weight: 500;
  border: var(--border-width) solid var(--border-default);
  color: var(--text-secondary); cursor: pointer;
  transition: background 120ms, border-color 120ms, color 120ms;
  background: transparent;
}
.chip:hover { background: var(--bg-subtle); }
.chip.active {
  background: var(--accent-subtle); border-color: var(--accent-primary);
  color: var(--accent-text);
}
.select-wrap { position: relative; }
.select-wrap select {
  width: 100%; height: 34px; padding: 0 32px 0 10px;
  font-family: var(--font-sans); font-size: 13px;
  color: var(--text-primary); background: var(--bg-surface);
  border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-md); appearance: none; outline: none; cursor: pointer;
}
.select-wrap select:focus { border-color: var(--accent-primary); box-shadow: var(--shadow-focus); }
.select-chevron {
  position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
  color: var(--text-quaternary); pointer-events: none;
}

/* Main */
.main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.main-header {
  padding: var(--sp-5) var(--sp-6);
  border-bottom: var(--border-width) solid var(--border-subtle);
  background: var(--bg-base);
  display: flex; align-items: center; gap: var(--sp-4);
}
.search-wrap { position: relative; flex: 1; max-width: 480px; }
.search-wrap input {
  width: 100%; height: 38px; padding: 0 12px 0 36px;
  font-family: var(--font-sans); font-size: 14px;
  color: var(--text-primary); background: var(--bg-surface);
  border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-md); outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.search-wrap input:focus { border-color: var(--accent-primary); box-shadow: var(--shadow-focus); }
.search-wrap input::placeholder { color: var(--text-quaternary); }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-quaternary); }
.results-count {
  font-family: var(--font-sans); font-size: 13px; color: var(--text-tertiary);
  white-space: nowrap;
}
.results-count strong { color: var(--text-primary); font-weight: 500; }
.sort-wrap { margin-left: auto; position: relative; display: flex; align-items: center; gap: var(--sp-2); }
.sort-label { font-family: var(--font-sans); font-size: 13px; color: var(--text-tertiary); white-space: nowrap; }
.sort-select {
  height: 32px; padding: 0 28px 0 10px;
  font-family: var(--font-sans); font-size: 13px;
  color: var(--text-primary); background: var(--bg-surface);
  border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-md); appearance: none; outline: none; cursor: pointer; min-width: 140px;
}

/* Grid */
.results-grid {
  flex: 1; padding: var(--sp-6);
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--sp-4); align-content: start;
}
.researcher-card {
  background: var(--bg-surface);
  border: var(--border-width) solid var(--border-subtle);
  border-radius: var(--radius-lg); padding: var(--sp-5);
  display: flex; flex-direction: column; gap: var(--sp-3);
  cursor: pointer; transition: border-color 150ms, box-shadow 150ms;
  text-decoration: none;
}
.researcher-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.rc-header { display: flex; align-items: flex-start; gap: var(--sp-3); }
.rc-info { flex: 1; min-width: 0; }
.rc-name {
  font-family: var(--font-sans); font-size: 14px; font-weight: 600;
  color: var(--text-primary); letter-spacing: -0.005em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rc-dep { font-family: var(--font-sans); font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.rc-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.rc-metrics { display: flex; gap: var(--sp-5); padding-top: var(--sp-3); border-top: var(--border-width) solid var(--border-subtle); }
.rc-metric { display: flex; flex-direction: column; gap: 1px; }
.rc-metric-val { font-family: var(--font-mono); font-size: 16px; font-weight: 600; color: var(--text-primary); }
.rc-metric-label { font-family: var(--font-sans); font-size: 11px; color: var(--text-quaternary); }

/* Pagination */
.pagination {
  padding: var(--sp-5) var(--sp-6);
  border-top: var(--border-width) solid var(--border-subtle);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-base);
}
.page-info { font-family: var(--font-sans); font-size: 13px; color: var(--text-tertiary); }
.page-btns { display: flex; gap: var(--sp-1); }
.page-btn {
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md); border: var(--border-width) solid transparent;
  font-family: var(--font-sans); font-size: 13px; cursor: pointer; background: none;
  color: var(--text-tertiary); transition: background 120ms, color 120ms, border-color 120ms;
}
.page-btn:hover { background: var(--bg-subtle); color: var(--text-primary); }
.page-btn.active { border-color: var(--border-default); color: var(--text-primary); font-weight: 500; }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

function Icon({ name, size = 16, strokeWidth = 1.5 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const key = name.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join("");
      const el = lucide.createElement(lucide[key]);
      if (el) { el.setAttribute("width", size); el.setAttribute("height", size); el.setAttribute("stroke-width", strokeWidth); ref.current.appendChild(el); }
    }
  }, [name, size]);
  return <span ref={ref} style={{ display: "inline-flex", alignItems: "center" }} />;
}

function ModeToggle({ theme, setTheme }) {
  return (
    <div className="mode-toggle-fixed">
      <button className={`mt-btn ${theme === "light" ? "active" : ""}`} onClick={() => setTheme("light")}><Icon name="sun" size={13} /></button>
      <button className={`mt-btn ${theme === "dark" ? "active" : ""}`} onClick={() => setTheme("dark")}><Icon name="moon" size={13} /></button>
    </div>
  );
}

const AREAS = ["Machine learning", "Redes", "PLN", "Bioinformática", "IoT", "Química", "Derecho", "Educación", "Economía", "Medicina"];
const DEPS = ["Todas las dependencias", "Fac. de Ingeniería", "Fac. de Medicina", "UAMRR", "Fac. de Derecho", "Fac. de Educación", "Fac. de Comercio", "UAM Mante"];
const SNII = ["Todos", "Candidato", "Nivel I", "Nivel II", "Nivel III"];

const RESEARCHERS = [
  { id: 1, name: "Dra. María Elena Cárdenas Ruiz", dep: "Fac. de Ingeniería", snii: "II", areas: ["Machine learning", "Redes", "PLN"], papers: 84, citas: 1284, initials: "MC" },
  { id: 2, name: "Dr. Arturo Velázquez Ríos", dep: "Fac. de Medicina", snii: "I", areas: ["Bioinformática", "Química"], papers: 51, citas: 723, initials: "AV" },
  { id: 3, name: "Dra. Sofía Montoya Perales", dep: "UAMRR", snii: "C", areas: ["Educación", "PLN"], papers: 29, citas: 312, initials: "SM" },
  { id: 4, name: "Dr. Luis Felipe Garza Torres", dep: "Fac. de Derecho", snii: "—", areas: ["Derecho", "Economía"], papers: 17, citas: 89, initials: "LG" },
  { id: 5, name: "Dra. Patricia Rangel Herrera", dep: "Fac. de Ingeniería", snii: "II", areas: ["IoT", "Redes"], papers: 62, citas: 940, initials: "PR" },
  { id: 6, name: "Dr. Jorge Hernández Mota", dep: "Fac. de Medicina", snii: "III", areas: ["Medicina", "Bioinformática"], papers: 118, citas: 2341, initials: "JH" },
  { id: 7, name: "Dra. Carmen Reyes Villanueva", dep: "Fac. de Comercio", snii: "I", areas: ["Economía", "Educación"], papers: 34, citas: 421, initials: "CR" },
  { id: 8, name: "Dr. Daniel Morales Fuentes", dep: "UAM Mante", snii: "C", areas: ["Química"], papers: 22, citas: 178, initials: "DM" },
  { id: 9, name: "Dra. Elena Bustamante Arias", dep: "Fac. de Ingeniería", snii: "I", areas: ["Machine learning", "IoT"], papers: 45, citas: 612, initials: "EB" },
  { id: 10, name: "Dr. Rodrigo Vega Salinas", dep: "UAMRR", snii: "II", areas: ["Redes", "PLN"], papers: 71, citas: 1023, initials: "RV" },
  { id: 11, name: "Dra. Irma López Castellanos", dep: "Fac. de Educación", snii: "C", areas: ["Educación"], papers: 15, citas: 94, initials: "IL" },
  { id: 12, name: "Dr. Miguel Ángel Torres Díaz", dep: "Fac. de Medicina", snii: "II", areas: ["Medicina", "Química"], papers: 88, citas: 1567, initials: "MT" },
  { id: 13, name: "Dra. Valeria Soto Ibáñez", dep: "Fac. de Derecho", snii: "I", areas: ["Derecho"], papers: 28, citas: 203, initials: "VS" },
  { id: 14, name: "Dr. Ernesto Chávez Ramírez", dep: "Fac. de Ingeniería", snii: "III", areas: ["Machine learning", "Bioinformática"], papers: 134, citas: 3102, initials: "EC" },
  { id: 15, name: "Dra. Adriana Medina Paredes", dep: "UAM Mante", snii: "C", areas: ["Economía", "Educación"], papers: 11, citas: 67, initials: "AM" },
  { id: 16, name: "Dr. Fernando Acosta Núñez", dep: "Fac. de Comercio", snii: "I", areas: ["Economía"], papers: 39, citas: 488, initials: "FA" },
  { id: 17, name: "Dra. Laura Quintero Vázquez", dep: "UAMRR", snii: "II", areas: ["PLN", "Machine learning"], papers: 56, citas: 876, initials: "LQ" },
  { id: 18, name: "Dr. Héctor Robles Mendoza", dep: "Fac. de Medicina", snii: "I", areas: ["Medicina"], papers: 43, citas: 534, initials: "HR" },
  { id: 19, name: "Dra. Gabriela Flores Ortega", dep: "Fac. de Educación", snii: "C", areas: ["Educación", "Economía"], papers: 19, citas: 142, initials: "GF" },
  { id: 20, name: "Dr. Oscar Pérez Domínguez", dep: "Fac. de Ingeniería", snii: "II", areas: ["IoT", "Redes", "Machine learning"], papers: 77, citas: 1128, initials: "OP" },
  { id: 21, name: "Dra. Norma Salinas Aguirre", dep: "Fac. de Derecho", snii: "I", areas: ["Derecho", "Educación"], papers: 24, citas: 198, initials: "NS" },
  { id: 22, name: "Dr. Ricardo Gutiérrez Leal", dep: "Fac. de Comercio", snii: "C", areas: ["Economía"], papers: 14, citas: 89, initials: "RG" },
  { id: 23, name: "Dra. Beatriz Jiménez Cruz", dep: "UAMRR", snii: "III", areas: ["Bioinformática", "Química"], papers: 102, citas: 2198, initials: "BJ" },
  { id: 24, name: "Dr. Alejandro Ruiz Peña", dep: "UAM Mante", snii: "I", areas: ["Redes"], papers: 33, citas: 287, initials: "AR" },
];

const PER_PAGE = 12;

function Directorio() {
  const [theme, setTheme] = useState(() => localStorage.getItem("ic-theme") || "light");
  const [search, setSearch] = useState("");
  const [activeAreas, setActiveAreas] = useState([]);
  const [dep, setDep] = useState("Todas las dependencias");
  const [snii, setSnii] = useState("Todos");
  const [sort, setSort] = useState("relevancia");
  const [page, setPage] = useState(1);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("ic-theme", theme);
  }, [theme]);

  const toggleArea = (a) => setActiveAreas(prev => prev.includes(a) ? prev.filter(x => x !== a) : [...prev, a]);

  const filtered = useMemo(() => {
    let r = RESEARCHERS;
    if (search) r = r.filter(x => x.name.toLowerCase().includes(search.toLowerCase()) || x.areas.some(a => a.toLowerCase().includes(search.toLowerCase())));
    if (activeAreas.length) r = r.filter(x => x.areas.some(a => activeAreas.includes(a)));
    if (dep !== "Todas las dependencias") r = r.filter(x => x.dep === dep);
    if (snii !== "Todos") r = r.filter(x => x.snii === snii.replace("Nivel ", "").replace("Candidato", "C"));
    if (sort === "alfabético") r = [...r].sort((a,b) => a.name.localeCompare(b.name));
    if (sort === "productividad") r = [...r].sort((a,b) => b.papers - a.papers);
    return r;
  }, [search, activeAreas, dep, snii, sort]);

  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const paged = filtered.slice((page - 1) * PER_PAGE, page * PER_PAGE);

  useEffect(() => { setPage(1); }, [search, activeAreas, dep, snii, sort]);

  return (
    <div className="page">
      <header className="topbar">
        <a className="logo" href="Screen 1 - Home.html">
          <span className="logo-uat">UAT</span>
          <span className="logo-sub">IntellectClone</span>
        </a>
        <nav className="topbar-nav" style={{ marginLeft: "var(--sp-6)" }}>
          {["Directorio", "Red de colaboración", "Acerca"].map((item, i) => (
            <button key={item} className={`topbar-nav-item ${i === 0 ? "active" : ""}`}>{item}</button>
          ))}
        </nav>
        <div className="topbar-actions">
          <button className="btn btn-secondary btn-sm">Iniciar sesión</button>
        </div>
      </header>

      <div className="layout">
        {/* Sidebar filtros */}
        <aside className="filter-sidebar">
          <div style={{ fontFamily: "var(--font-sans)", fontSize: 13, fontWeight: 600, color: "var(--text-primary)" }}>Filtros</div>
          <div className="filter-group">
            <div className="filter-label">Área de conocimiento</div>
            <div className="filter-chips">
              {AREAS.map(a => (
                <button key={a} className={`chip ${activeAreas.includes(a) ? "active" : ""}`} onClick={() => toggleArea(a)}>{a}</button>
              ))}
            </div>
          </div>
          <div className="filter-group">
            <div className="filter-label">Dependencia</div>
            <div className="select-wrap">
              <select value={dep} onChange={e => setDep(e.target.value)}>
                {DEPS.map(d => <option key={d}>{d}</option>)}
              </select>
              <span className="select-chevron"><Icon name="chevron-down" size={13} /></span>
            </div>
          </div>
          <div className="filter-group">
            <div className="filter-label">Nivel SNII</div>
            <div className="filter-chips">
              {SNII.map(s => (
                <button key={s} className={`chip ${snii === s ? "active" : ""}`} onClick={() => setSnii(s)}>{s}</button>
              ))}
            </div>
          </div>
          {(activeAreas.length > 0 || dep !== "Todas las dependencias" || snii !== "Todos") && (
            <button className="btn btn-ghost btn-sm" style={{ marginTop: "auto" }} onClick={() => { setActiveAreas([]); setDep("Todas las dependencias"); setSnii("Todos"); }}>
              <Icon name="x" size={13} />
              Limpiar filtros
            </button>
          )}
        </aside>

        {/* Main */}
        <div className="main-area">
          <div className="main-header">
            <div className="search-wrap">
              <span className="search-icon"><Icon name="search" size={15} /></span>
              <input placeholder="Buscar por nombre, área o dependencia…" value={search} onChange={e => setSearch(e.target.value)} />
            </div>
            <div className="results-count">
              <strong>{filtered.length}</strong> investigadores
            </div>
            <div className="sort-wrap">
              <span className="sort-label">Ordenar por</span>
              <div style={{ position: "relative" }}>
                <select className="sort-select" value={sort} onChange={e => setSort(e.target.value)}>
                  <option value="relevancia">Relevancia</option>
                  <option value="alfabético">Alfabético</option>
                  <option value="productividad">Productividad</option>
                </select>
                <span style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", color: "var(--text-quaternary)", pointerEvents: "none" }}><Icon name="chevron-down" size={13} /></span>
              </div>
            </div>
          </div>

          <div className="results-grid">
            {paged.length === 0 ? (
              <div style={{ gridColumn: "1/-1", display: "flex", flexDirection: "column", alignItems: "center", padding: "80px 0", gap: "var(--sp-3)" }}>
                <div style={{ color: "var(--text-quaternary)" }}><Icon name="search" size={32} strokeWidth={1.25} /></div>
                <div style={{ fontFamily: "var(--font-sans)", fontSize: 16, fontWeight: 600, color: "var(--text-primary)" }}>Sin resultados</div>
                <div style={{ fontFamily: "var(--font-sans)", fontSize: 13, color: "var(--text-tertiary)" }}>Intenta con otros filtros o términos de búsqueda.</div>
              </div>
            ) : paged.map(r => (
              <a key={r.id} className="researcher-card" href="Screen 3 - Perfil.html">
                <div className="rc-header">
                  <div className="avatar avatar-md">{r.initials}</div>
                  <div className="rc-info">
                    <div className="rc-name">{r.name}</div>
                    <div className="rc-dep">{r.dep}</div>
                  </div>
                  {r.snii !== "—" && <span className="tag tag-info">{r.snii}</span>}
                </div>
                <div className="rc-tags">
                  {r.areas.slice(0, 3).map(a => (
                    <span key={a} className="tag tag-neutral pill">{a}</span>
                  ))}
                </div>
                <div className="rc-metrics">
                  <div className="rc-metric">
                    <div className="rc-metric-val">{r.papers}</div>
                    <div className="rc-metric-label">papers</div>
                  </div>
                  <div className="rc-metric">
                    <div className="rc-metric-val">{r.citas.toLocaleString()}</div>
                    <div className="rc-metric-label">citas</div>
                  </div>
                </div>
              </a>
            ))}
          </div>

          {totalPages > 1 && (
            <div className="pagination">
              <div className="page-info">Página {page} de {totalPages} · {filtered.length} resultados</div>
              <div className="page-btns">
                <button className="page-btn" disabled={page === 1} onClick={() => setPage(p => p - 1)}>
                  <Icon name="chevron-left" size={14} />
                </button>
                {Array.from({ length: Math.min(totalPages, 5) }, (_, i) => i + 1).map(p => (
                  <button key={p} className={`page-btn ${page === p ? "active" : ""}`} onClick={() => setPage(p)}>{p}</button>
                ))}
                <button className="page-btn" disabled={page === totalPages} onClick={() => setPage(p => p + 1)}>
                  <Icon name="chevron-right" size={14} />
                </button>
              </div>
            </div>
          )}
        </div>
      </div>

      <ModeToggle theme={theme} setTheme={setTheme} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Directorio />);
</script>
</body>
</html>
