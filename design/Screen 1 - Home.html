<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IntellectClone — Home</title>
<link rel="stylesheet" href="screens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* ── Hero ── */
.hero {
  padding: 120px var(--sp-8) 96px;
  max-width: 1200px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center;
}
.hero-eyebrow {
  font-family: var(--font-sans); font-size: 11px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-quaternary);
  margin-bottom: var(--sp-4);
}
.hero-title {
  font-family: var(--font-sans); font-size: 48px; font-weight: 600;
  letter-spacing: -0.025em; line-height: 1.05; color: var(--text-primary);
  margin-bottom: var(--sp-5);
}
.hero-title em { font-style: normal; color: var(--accent-primary); }
.hero-desc {
  font-family: var(--font-sans); font-size: 16px; font-weight: 400;
  line-height: 1.55; color: var(--text-tertiary);
  max-width: 480px; margin-bottom: var(--sp-8);
}
.hero-actions { display: flex; align-items: center; gap: var(--sp-3); }
.hero-visual {
  position: relative; aspect-ratio: 4/3;
  background: var(--bg-subtle); border-radius: var(--radius-xl);
  border: var(--border-width) solid var(--border-subtle);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.hero-graph-placeholder {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
}
.hero-network {
  position: relative; width: 300px; height: 200px;
}

/* ── Stats strip ── */
.stats-strip {
  border-top: var(--border-width) solid var(--border-subtle);
  border-bottom: var(--border-width) solid var(--border-subtle);
  background: var(--bg-surface);
}
.stats-strip-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 var(--sp-8);
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.stats-strip-item {
  padding: var(--sp-6) var(--sp-6);
  border-right: var(--border-width) solid var(--border-subtle);
  display: flex; flex-direction: column; gap: var(--sp-1);
}
.stats-strip-item:last-child { border-right: none; }
.stats-num {
  font-family: var(--font-mono); font-size: 32px; font-weight: 600;
  color: var(--text-primary); line-height: 1;
}
.stats-label {
  font-family: var(--font-sans); font-size: 13px; color: var(--text-tertiary);
}

/* ── Features ── */
.features {
  max-width: 1200px; margin: 0 auto;
  padding: 80px var(--sp-8);
  display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-6);
}
.feature-card {
  padding: var(--sp-8);
  background: var(--bg-surface);
  border: var(--border-width) solid var(--border-subtle);
  border-radius: var(--radius-xl);
  display: flex; flex-direction: column; gap: var(--sp-4);
  transition: border-color 200ms;
  cursor: pointer; position: relative; overflow: hidden;
}
.feature-card:hover { border-color: var(--border-strong); }
.feature-card.restricted { opacity: 1; }
.feature-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent-primary);
}
.feature-title {
  font-family: var(--font-sans); font-size: 18px; font-weight: 600;
  letter-spacing: -0.01em; color: var(--text-primary); line-height: 1.3;
}
.feature-desc {
  font-family: var(--font-sans); font-size: 14px; color: var(--text-tertiary);
  line-height: 1.5; flex: 1;
}
.feature-cta {
  display: flex; align-items: center; gap: var(--sp-1);
  font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  color: var(--accent-primary);
}
.restricted-badge {
  position: absolute; top: var(--sp-4); right: var(--sp-4);
}

/* ── Endorsed ── */
.endorsed {
  border-top: var(--border-width) solid var(--border-subtle);
  background: var(--bg-subtle);
  padding: var(--sp-12) var(--sp-8);
}
.endorsed-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; flex-direction: column; gap: var(--sp-6); align-items: center;
}
.endorsed-label {
  font-family: var(--font-sans); font-size: 11px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-quaternary);
}
.endorsed-logos {
  display: flex; align-items: center; gap: var(--sp-10);
}
.endorsed-item {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-1);
}
.endorsed-name {
  font-family: var(--font-sans); font-size: 13px; font-weight: 600;
  color: var(--text-secondary); letter-spacing: 0.02em;
}
.endorsed-sub {
  font-family: var(--font-sans); font-size: 11px; color: var(--text-quaternary);
}
.pdi-badge {
  border: var(--border-width) solid var(--border-default);
  border-radius: var(--radius-md); padding: var(--sp-2) var(--sp-3);
  display: flex; align-items: center; gap: var(--sp-2);
  background: var(--bg-surface);
}
.pdi-text {
  font-family: var(--font-sans); font-size: 12px; font-weight: 500;
  color: var(--text-secondary);
}
.pdi-sub {
  font-family: var(--font-sans); font-size: 11px; color: var(--text-quaternary);
}

/* ── Footer ── */
.site-footer {
  border-top: var(--border-width) solid var(--border-subtle);
  padding: var(--sp-8);
  background: var(--bg-base);
}
.site-footer-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
}
.footer-links {
  display: flex; gap: var(--sp-6); align-items: center;
}
.footer-link {
  font-family: var(--font-sans); font-size: 13px; color: var(--text-quaternary);
  text-decoration: none; transition: color 120ms;
}
.footer-link:hover { color: var(--text-secondary); }
.footer-copy {
  font-family: var(--font-sans); font-size: 12px; color: var(--text-quaternary);
}

/* ── Network viz (decorative) ── */
svg.network-svg .node { fill: var(--bg-muted); stroke: var(--border-default); stroke-width: 1; }
svg.network-svg .node.accent { fill: var(--accent-subtle); stroke: var(--accent-primary); }
svg.network-svg .edge { stroke: var(--border-default); stroke-width: 1; opacity: 0.6; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Icon({ name, size = 16, strokeWidth = 1.5 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const key = name.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join("");
      const el = lucide.createElement(lucide[key]);
      if (el) { el.setAttribute("width", size); el.setAttribute("height", size); el.setAttribute("stroke-width", strokeWidth); ref.current.appendChild(el); }
    }
  }, [name, size]);
  return <span ref={ref} style={{ display: "inline-flex", alignItems: "center" }} />;
}

function ModeToggle({ theme, setTheme }) {
  return (
    <div className="mode-toggle-fixed">
      <button className={`mt-btn ${theme === "light" ? "active" : ""}`} onClick={() => setTheme("light")}><Icon name="sun" size={13} /></button>
      <button className={`mt-btn ${theme === "dark" ? "active" : ""}`} onClick={() => setTheme("dark")}><Icon name="moon" size={13} /></button>
    </div>
  );
}

// Decorative network visualization
function NetworkViz() {
  const nodes = [
    { x: 150, y: 100, r: 18, accent: true, label: "MC" },
    { x: 260, y: 70,  r: 12, accent: false, label: "AV" },
    { x: 280, y: 150, r: 10, accent: false, label: "SM" },
    { x: 70,  y: 140, r: 14, accent: false, label: "LG" },
    { x: 100, y: 60,  r: 9,  accent: false, label: "PR" },
    { x: 200, y: 180, r: 8,  accent: false, label: "JH" },
    { x: 340, y: 110, r: 7,  accent: false, label: "CR" },
    { x: 50,  y: 190, r: 6,  accent: false, label: "DM" },
    { x: 190, y: 50,  r: 7,  accent: false, label: "EB" },
    { x: 130, y: 190, r: 9,  accent: false, label: "RV" },
  ];
  const edges = [
    [0,1],[0,2],[0,3],[0,4],[0,9],[1,2],[1,6],[2,5],[3,7],[4,8],[5,9],[6,2]
  ];
  return (
    <svg width="380" height="240" className="network-svg" style={{ overflow: "visible" }}>
      {edges.map(([a, b], i) => (
        <line key={i} className="edge"
          x1={nodes[a].x} y1={nodes[a].y}
          x2={nodes[b].x} y2={nodes[b].y}
        />
      ))}
      {nodes.map((n, i) => (
        <g key={i}>
          <circle className={`node ${n.accent ? "accent" : ""}`} cx={n.x} cy={n.y} r={n.r} />
          {n.r >= 12 && (
            <text x={n.x} y={n.y + 1} textAnchor="middle" dominantBaseline="middle"
              style={{ fontSize: n.r * 0.65, fontFamily: "var(--font-sans)", fontWeight: 500, fill: n.accent ? "var(--accent-text)" : "var(--text-tertiary)", pointerEvents: "none" }}>
              {n.label}
            </text>
          )}
        </g>
      ))}
    </svg>
  );
}

function Home() {
  const [theme, setTheme] = useState(() => localStorage.getItem("ic-theme") || "light");
  const [activeNav, setActiveNav] = useState(0);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("ic-theme", theme);
  }, [theme]);

  const stats = [
    { num: "612", label: "investigadores activos" },
    { num: "14,830", label: "publicaciones indexadas" },
    { num: "47", label: "cuerpos académicos" },
    { num: "23", label: "áreas de conocimiento" },
  ];

  const features = [
    {
      icon: "users",
      title: "Directorio de investigadores",
      desc: "Consulta la producción intelectual de la comunidad UAT: publicaciones, citas, áreas de especialización y redes de colaboración.",
      cta: "Explorar directorio",
      href: "Screen 2 - Directorio.html",
      restricted: false,
    },
    {
      icon: "git-branch",
      title: "Red de colaboración",
      desc: "Visualiza cómo se conectan los investigadores UAT a través de coautorías. Identifica nodos clave y colaboraciones interdisciplinarias.",
      cta: "Ver red",
      href: "Screen 4 - Red.html",
      restricted: false,
    },
    {
      icon: "cpu",
      title: "Simulador de escenarios",
      desc: "Formule escenarios y obtenga respuestas agregadas de gemelos digitales de la comunidad académica. Herramienta de prospectiva institucional.",
      cta: "Acceder al simulador",
      href: "Screen 6 - Simulador.html",
      restricted: true,
    },
  ];

  return (
    <div className="page">
      {/* Topbar */}
      <header className="topbar">
        <a className="logo" href="#">
          <span className="logo-uat">UAT</span>
          <span className="logo-sub">IntellectClone</span>
        </a>
        <nav className="topbar-nav" style={{ marginLeft: "var(--sp-6)" }}>
          {["Directorio", "Red de colaboración", "Acerca"].map((item, i) => (
            <button key={item} className={`topbar-nav-item ${activeNav === i ? "active" : ""}`} onClick={() => setActiveNav(i)}>{item}</button>
          ))}
        </nav>
        <div className="topbar-actions">
          <button className="btn btn-secondary btn-sm">Iniciar sesión</button>
        </div>
      </header>

      {/* Hero */}
      <section style={{ background: "var(--bg-base)" }}>
        <div className="hero">
          <div>
            <div className="hero-eyebrow">Universidad Autónoma de Tamaulipas · PDI 2024–2028</div>
            <h1 className="hero-title">La comunidad académica UAT, <em>en forma digital</em></h1>
            <p className="hero-desc">
              IntellectClone construye gemelos digitales de los investigadores UAT a partir de su producción académica pública. Consulta perfiles, explora redes de colaboración y simula respuestas institucionales.
            </p>
            <div className="hero-actions">
              <a href="Screen 2 - Directorio.html" className="btn btn-primary btn-lg">
                <Icon name="search" size={16} />
                Explorar directorio
              </a>
              <a href="Screen 5 - Acerca.html" className="btn btn-ghost btn-lg">Conocer el proyecto</a>
            </div>
          </div>
          <div className="hero-visual">
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <NetworkViz />
            </div>
            <div style={{
              position: "absolute", bottom: 16, left: 16, right: 16,
              background: "var(--bg-surface)", borderRadius: "var(--radius-lg)",
              border: "var(--border-width) solid var(--border-subtle)",
              padding: "12px 16px", display: "flex", alignItems: "center", gap: 10,
              boxShadow: "var(--shadow-md)"
            }}>
              <div className="avatar avatar-sm avatar-self">MC</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: "var(--font-sans)", fontSize: 13, fontWeight: 500, color: "var(--text-primary)" }}>Dra. María Elena Cárdenas</div>
                <div style={{ fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--text-quaternary)" }}>Facultad de Ingeniería · SNII Nivel II</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span className="twin-dot generated" />
                <span style={{ fontFamily: "var(--font-sans)", fontSize: 12, color: "var(--accent-primary)" }}>Gemelo generado</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* Stats strip */}
      <div className="stats-strip">
        <div className="stats-strip-inner">
          {stats.map(s => (
            <div key={s.label} className="stats-strip-item">
              <div className="stats-num">{s.num}</div>
              <div className="stats-label">{s.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Features */}
      <section>
        <div className="features">
          {features.map(f => (
            <a key={f.title} href={f.href} className={`feature-card ${f.restricted ? "restricted" : ""}`} style={{ textDecoration: "none" }}>
              {f.restricted && (
                <div className="restricted-badge">
                  <span className="tag tag-warning">Solo personal autorizado</span>
                </div>
              )}
              <div className="feature-icon">
                <Icon name={f.icon} size={22} strokeWidth={1.5} />
              </div>
              <div className="feature-title">{f.title}</div>
              <div className="feature-desc">{f.desc}</div>
              <div className="feature-cta">
                {f.cta}
                <Icon name="arrow-right" size={14} />
              </div>
            </a>
          ))}
        </div>
      </section>

      {/* Endorsed */}
      <div className="endorsed">
        <div className="endorsed-inner">
          <div className="endorsed-label">Respaldado por</div>
          <div className="endorsed-logos">
            <div className="endorsed-item">
              <div className="endorsed-name">Rectoría UAT</div>
              <div className="endorsed-sub">Universidad Autónoma de Tamaulipas</div>
            </div>
            <div style={{ width: 1, height: 32, background: "var(--border-default)" }} />
            <div className="endorsed-item">
              <div className="endorsed-name">Oficina de Asesores</div>
              <div className="endorsed-sub">Secretaría Académica</div>
            </div>
            <div style={{ width: 1, height: 32, background: "var(--border-default)" }} />
            <div className="pdi-badge">
              <div style={{ display: "flex", flexDirection: "column" }}>
                <div className="pdi-text">PDI 2024–2028</div>
                <div className="pdi-sub">«La UAT se Transforma»</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* Footer */}
      <footer className="site-footer">
        <div className="site-footer-inner">
          <div className="logo">
            <span className="logo-uat">UAT</span>
            <span className="logo-sub">IntellectClone</span>
          </div>
          <div className="footer-links">
            <a href="#" className="footer-link">Privacidad</a>
            <a href="#" className="footer-link">Solicitar baja del sistema</a>
            <a href="#" className="footer-link">Contacto</a>
            <a href="Screen 5 - Acerca.html" className="footer-link">Acerca del proyecto</a>
          </div>
          <div className="footer-copy">© 2025 Universidad Autónoma de Tamaulipas</div>
        </div>
      </footer>

      <ModeToggle theme={theme} setTheme={setTheme} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Home />);
</script>
</body>
</html>
